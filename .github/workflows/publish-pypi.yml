name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built distributions to PyPI. Only works for commits contained in master. Leave false for a dry run."
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  tests:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run v2 tests
        run: bash scripts/test-v2.sh

  build-smoke:
    name: Build smoke Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel and smoke-test installed package
        run: bash scripts/smoke-build.sh

  build-dist:
    name: Build PyPI artifacts
    runs-on: ubuntu-latest
    needs:
      - tests
      - build-smoke

    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.release_notes.outputs.path }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      should_publish: ${{ steps.target.outputs.should_publish }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Determine package version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          from importlib import import_module
          print(import_module("meterbus").__version__)
          PY
          )
          if [[ "${VERSION}" =~ (a|b|rc) ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Confirm this is a master release
        id: target
        run: |
          SHOULD_PUBLISH=false
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            SHOULD_PUBLISH=true
          fi

          git fetch origin master --prune
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/master"; then
            echo "This commit is not contained in origin/master. Use publish-testpypi.yml for non-master releases." >&2
            exit 1
          fi

          echo "should_publish=${SHOULD_PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "Should publish to PyPI: ${SHOULD_PUBLISH}"

      - name: Find release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="docs/releases/${VERSION}.md"
          if [[ ! -f "${NOTES}" ]]; then
            echo "release notes not found: ${NOTES}" >&2
            exit 1
          fi
          echo "path=${NOTES}" >> "${GITHUB_OUTPUT}"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: pymeterbus-pypi-dist-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-dist
    if: needs.build-dist.outputs.should_publish == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/pyMeterBus/${{ needs.build-dist.outputs.version }}/

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: pymeterbus-pypi-dist-${{ needs.build-dist.outputs.version }}
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-dist
      - publish-pypi
    if: needs.build-dist.outputs.should_publish == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: pymeterbus-pypi-dist-${{ needs.build-dist.outputs.version }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-dist.outputs.version }}
          RELEASE_NOTES: ${{ needs.build-dist.outputs.release_notes }}
          PRERELEASE: ${{ needs.build-dist.outputs.prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${PRERELEASE}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v${VERSION}" \
            --title "pyMeterBus ${VERSION}" \
            --notes-file "${RELEASE_NOTES}" \
            ${PRERELEASE_FLAG} \
            dist/*
