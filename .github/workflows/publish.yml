name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI. Leave false for a dry run build/test/release-notes check."
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  tests:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run v2 tests
        run: bash scripts/test-v2.sh

  build-smoke:
    name: Build smoke Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel and smoke-test installed package
        run: bash scripts/smoke-build.sh

  build-dist:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs:
      - tests
      - build-smoke

    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.release_notes.outputs.path }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Determine package version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          from importlib import import_module
          print(import_module("meterbus").__version__)
          PY
          )
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            EXPECTED_TAG="v${VERSION}"
            if [[ "${TAG_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "tag ${TAG_NAME} does not match package version ${VERSION}; expected ${EXPECTED_TAG}" >&2
              exit 1
            fi
          fi
          if [[ "${VERSION}" =~ (a|b|rc) ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Find release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="docs/releases/${VERSION}.md"
          if [[ ! -f "${NOTES}" ]]; then
            echo "release notes not found: ${NOTES}" >&2
            exit 1
          fi
          echo "path=${NOTES}" >> "${GITHUB_OUTPUT}"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: pymeterbus-dist-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-dist
    if: github.event_name == 'push' && github.ref_type == 'tag'
    environment:
      name: pypi
      url: https://pypi.org/project/pyMeterBus/${{ needs.build-dist.outputs.version }}/

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: pymeterbus-dist-${{ needs.build-dist.outputs.version }}
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-dist
      - publish-pypi
    if: github.event_name == 'push' && github.ref_type == 'tag'

    steps:
      - uses: actions/checkout@v4

      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: pymeterbus-dist-${{ needs.build-dist.outputs.version }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-dist.outputs.version }}
          RELEASE_NOTES: ${{ needs.build-dist.outputs.release_notes }}
          PRERELEASE: ${{ needs.build-dist.outputs.prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${PRERELEASE}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v${VERSION}" \
            --title "pyMeterBus ${VERSION}" \
            --notes-file "${RELEASE_NOTES}" \
            ${PRERELEASE_FLAG} \
            dist/*
