name: Publish to TestPyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built distributions to TestPyPI. Leave false for a dry run."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  tests:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run v2 tests
        run: bash scripts/test-v2.sh

  build-smoke:
    name: Build smoke Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel and smoke-test installed package
        run: bash scripts/smoke-build.sh

  build-dist:
    name: Build TestPyPI artifacts
    runs-on: ubuntu-latest
    needs:
      - tests
      - build-smoke

    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.target.outputs.should_publish }}
      is_master: ${{ steps.target.outputs.is_master }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Determine package version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          from importlib import import_module
          print(import_module("meterbus").__version__)
          PY
          )
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            EXPECTED_TAG="v${VERSION}"
            if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "tag ${GITHUB_REF_NAME} does not match package version ${VERSION}; expected ${EXPECTED_TAG}" >&2
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Confirm this is not a master release
        id: target
        run: |
          SHOULD_PUBLISH=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            SHOULD_PUBLISH=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            SHOULD_PUBLISH=true
          fi

          git fetch origin master --prune
          IS_MASTER=false
          if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/master"; then
            IS_MASTER=true
          fi

          if [[ "${SHOULD_PUBLISH}" == "true" && "${IS_MASTER}" == "true" ]]; then
            echo "This commit is contained in origin/master. Use publish-pypi.yml for real PyPI releases." >&2
            exit 1
          fi

          echo "should_publish=${SHOULD_PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "is_master=${IS_MASTER}" >> "${GITHUB_OUTPUT}"
          echo "Should publish to TestPyPI: ${SHOULD_PUBLISH}"
          echo "Commit contained in origin/master: ${IS_MASTER}"

      - name: Find release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="docs/releases/${VERSION}.md"
          if [[ ! -f "${NOTES}" ]]; then
            echo "release notes not found: ${NOTES}" >&2
            exit 1
          fi

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: pymeterbus-testpypi-dist-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build-dist
    if: needs.build-dist.outputs.should_publish == 'true'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pyMeterBus/${{ needs.build-dist.outputs.version }}/

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: pymeterbus-testpypi-dist-${{ needs.build-dist.outputs.version }}
          path: dist

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
